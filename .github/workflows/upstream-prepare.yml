name: Upstream prepare

# Run by hand (or from the launcher's Maintainer settings) after reading the "upstream-update"
# issue. It merges upstream on a new branch, re-applies the branding, checks it, and opens a pull
# request. CI runs on that pull request. Nothing reaches users until a person merges it (with a
# merge commit, never a squash) and publishes a release.
#
# Pushing upstream's history needs a token that may touch workflow files, which the built-in token
# may not, so set the UPSTREAM_PUSH_TOKEN secret: a fine-grained token for this repository with
# Contents, Pull requests and Workflows read/write. A pull request opened with it also starts CI.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream
  cancel-in-progress: false

# The merge adds a git remote named "upstream", and gh prefers it over origin. Pin gh to this
# repository so issues and pull requests never go to the upstream project.
env:
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Needs the push token
        env:
          HAS_TOKEN: ${{ secrets.UPSTREAM_PUSH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Set the UPSTREAM_PUSH_TOKEN secret first (see the comment at the top of this workflow)."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PUSH_TOKEN }}
      - name: Merge upstream on a new branch and rebrand
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "flowapps-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 rebrand/upstream.py prepare --body pr.md --github-output 2>&1 | tee prepare.log
          exit "${PIPESTATUS[0]}"
      - name: Push and open the pull request
        if: steps.prep.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PUSH_TOKEN }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          TITLE: ${{ steps.prep.outputs.title }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git push origin "$BRANCH"
          URL="$(gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file pr.md)"
          echo "Pull request: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
          ISSUE="$(gh issue list --label upstream-update --state open --json number --jq '.[0].number')"
          if [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" --body "Prepared for review: $URL"; fi
      - name: Report a stop
        if: failure()
        run: |
          {
            echo "## Upstream prepare stopped"
            echo
            echo "Nothing was pushed. The merge needs a person: follow docs/UPSTREAM.md."
            echo
            echo '```'
            tail -60 prepare.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
